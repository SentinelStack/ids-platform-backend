server:
  port: 8080
  # Honour X-Forwarded-* from nginx so HATEOAS links use the public https host
  # (not the internal http origin) — otherwise the browser blocks them as mixed content.
  forward-headers-strategy: framework

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://194.62.122.30:27017/ids_platform}
      # Explicit DB name. On Spring Boot 4 / Spring Data Mongo 5 the database
      # segment of the URI is not applied on its own (it falls back to "test"),
      # so it is pinned here.
      database: ${MONGODB_DATABASE:ids_platform}
      # Index/collection creation is owned by Mongock migrations, not Spring.
      auto-index-creation: false

mongock:
  migration-scan-package: ro.puk3p.sentinel.migration
  # Standalone MongoDB (no replica set) does not support multi-document
  # transactions; index/collection DDL does not need them.
  transaction-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info


app:
  cors:
    # Comma-separated list of browser origins allowed to call /api/**.
    # Defaults to the Angular dev server; override with CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://sentinel.puk3p.online}
  jwt:
    # HS256 signing secret (>= 32 bytes). MUST be overridden in production.
    secret: ${APP_JWT_SECRET:change-me-aegis-jwt-secret-please-rotate-0123456789}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:720}
  agent:
    # Shared key the OpenWrt edge agent presents (X-API-Key header or apiKey
    # query param) to reach the agent-facing endpoints. Override in production.
    api-key: ${AGENT_API_KEY:edge-agent-7f3c1a9e5b2d4f80}
  google:
    # OAuth 2.0 Web client id used to verify "Sign in with Google" ID tokens.
    # Leave blank to disable Google sign-in; set GOOGLE_CLIENT_ID to enable.
    client-id: ${GOOGLE_CLIENT_ID:}
